<!doctype html>
<html lang="pt-">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekken-6 Dataframe</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="theme-1 bg-neutral-800">
    <!-- <div
      class="fixed h-dvh inset-0 bg-neutral-600 bg-gradient-to-tr from-indigo-800/27 to-black/65"
    >
      <div
        class="w-full h-full bg-[url(/src/assets/tekken-logo.png)] bg-no-repeat bg-top-right bg-contain sm:bg-auto opacity-18"

    <div
      id="app"
      class="max-h-dvh w-full z-50 w-full h-dvh min-h-dvh sm:h-full sm:max-h-full"
    >
      <div
        id="filters-card-container"
        class="fixed hidden z-99 h-full w-full bg-black/40 flex justify-center items-center"
      >
        <div
          id="filters-card"
          class="h-9/10 flex gap-7 flex-col max-w-95/100 w-110 bg-neutral-800 p-2 border-1 border-gray-700 text-white"
        >
          <div class="w-full flex">
            <div class="flex-1 items-center flex">
              <p class="text-xl">Filtros</p>
            </div>
            <button
              id="close-filter-card-btn"
              class="cursor-pointer text-gray-500 hover:text-white text-2xl"
            >
              x
            </button>
          </div>
          <div class="flex-1">
            <form id="filter-form" class="flex flex-col gap-5">
              <div class="flex flex-col gap-3">
                <p>Range</p>
                <div
                  id="range-check-div"
                  class="blorder-1 flex gap-2 flex-wrap"
                >
                  <div>
                    <input type="checkbox" id="high" name="range" value="h" />
                    <label class="" for="high"> High</label><br />
                  </div>
                  <div>
                    <input type="checkbox" id="medium" name="range" value="m" />
                    <label for="medium"> Mid</label><br />
                  </div>
                  <div>
                    <input type="checkbox" id="low" name="range" value="l" />
                    <label for="low"> Low</label>
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>Block</p>
                <div
                  id="block-check-div"
                  class="blorder-1 flex gap-2 flex-wrap"
                >
                  <div>
                    <input
                      type="checkbox"
                      id="positive-block"
                      name="block"
                      value="Positive"
                    />
                    <label for="positive-block"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-block"
                      name="block"
                      value="Negative"
                    />
                    <label for="negative-block"> Negative</label><br />
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>Hit</p>
                <div id="hit-check-div" class="blorder-1 flex gap-2 flex-wrap">
                  <div>
                    <input
                      type="checkbox"
                      id="positive-hit"
                      name="hit"
                      value="Positive"
                    />
                    <label for="positive-hit"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-hit"
                      name="hit"
                      value="Negative"
                    />
                    <label for="negative-hit"> Negative</label><br />
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>CH</p>
                <div id="ch-check-div" class="blorder-1 flex gap-2 flex-wrap">
                  <div>
                    <input
                      type="checkbox"
                      id="positive-ch"
                      name="ch"
                      value="Positive"
                    />
                    <label for="positive-ch"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-ch"
                      name="ch"
                      value="Negative"
                    />
                    <label for="negative-ch"> Negative</label><br />
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div
        id="main-content"
        class="flex max-h-full p-2 h-dvh min-h-dvh w-full sm:px-2 flex-col justify-between items-center sm:justify-start sm:px-0 sm:gap-1 sm:h-full"
      >
        <div
          class="h-20/100 flex flex-col justify-center w-full sm:w-270 sm:max-w-full sm:h-35 border-b-1 border-neutral-600"
        >
          <div
            id="back-btn-div"
            class="bg-red-40g0 h-5/10 text-white flex items-center"
          >
            <a
              id="back-btn"
              class="items-center flex hover:text-blue-400"
              href="/"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 mr-2"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              <span class="text-base font-medium">Voltar para a seleção</span>
            </a>
          </div>

          <div id="header-div" class="h-5/10 w-full flex justify-between py-1">
            <div
              id="title"
              class="h-full flex text-gray-300 justify-start text-center sm:text-xl"
            >
              <div
                id="title-char-img-div"
                class="h-full hidden border-neutral-950 border-2 aspect-square"
              >
                <img
                  onerror="this.classList.add('hidden')"
                  onload="this.classList.remove('hidden')"
                  id="title-char-img"
                  class="max-w-full max-h-full h-full aspect-square object-cover"
                  src=""
                  alt=""
                />
              </div>
              <p
                id="CharName"
                class="text-md text-stone-300 px-1 flex items-center font-semibold"
              ></p>
            </div>
            <div class="flex gap-1 items-center justify-end">
              <div
                id="mode-view-btn-card"
                class="text-whiteh bg-neutralg-900 text-neutral-400 sm:text-xl h-min flex rounded-xs border-1 border-neutral-900"
              >
                <button
                  id="mode-view-cards-btn"
                  class="hover:text-white cursor-pointer p-1 rounded-xs"
                >
                  Cards</button
                ><button
                  id="mode-view-table-btn"
                  class="hover:text-white cursor-pointer p-1 rounded-xs"
                >
                  Tabela
                </button>
              </div>
              <div
                id="filter-btn-div"
                class="text-white sm:text-xl h-full flex items-center"
              >
                <button
                  id="filter-card-btn"
                  class="bg-neutral-900 text-neutral-400 h-min border-1 border-neutral-900 border-1 border-neutral-600 hover:bg-neutral-700 hover:text-white cursor-pointer p-1 rounded-xs"
                >
                  <p id="filterP" class="">Filtros</p>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          id="main-container"
          class="flex h-80/100 w-full sm:w-270 max-w-full"
        ></div>
      </div>

      <div
        id="char-list-container"
        class="mx-auto items-center max-w-full sm:p-5h flex flex-col h-dvh"
      >
        <div class="p-5">
          <h1 class="text-2xl text-stone-300 px-1 p-g5">Lista</h1>
        </div>
        <!-- <div
          id="char-list"
          class="gap-2 bg-black max-h-full h-fçull flex flex-wrap overflow-y-auto"
        ></div> -->
      </div>
      <!-- <div
        id="load-container"
        class="w-full h-full gap-3 text-white fixed flex justify-center items-center"
      >
        <span
          class="w-10 h-10 border-2 animate-spin border-neutral-600 border-l-neutral-900 rounded-full"
        ></span>
        <p>Carregando…</p>
      </div> -->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
