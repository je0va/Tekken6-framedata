<!doctype html>
<html lang="pt-">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekken-6 Dataframe</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body class="theme-1">
    <div
      id="app"
      class="bg-neutral-600 fixed inset-0 bg-gradient-to-tr from-indigo-800/27 to-black/65"
    >
      <div
        class="bg-[url(/src/assets/tekken-logo.png)] bg-no-repeat bg-top-right bg-contain sm:bg-auto h-dvh fixed inset-0 opacity-18"
      ></div>
      <!-- <div
        class="bg-[url(/src/assets/noise.svg)] z-1 bg-no-repeat bg-center bg-cover h-dvh fixed inset-0 opacity-35"
      ></div> -->
      <div
        id="filters-card-container"
        class="fixed hidden z-99 h-full w-full bg-black/40 flex justify-center items-center"
      >
        <div
          id="filters-card"
          class="h-9/10 flex gap-7 flex-col max-w-95/100 w-110 bg-neutral-600 bg-gradient-to-tr from-indigo-800/27 to-black/65 p-2 border-1 border-gray-700 text-white"
        >
          <div class="w-full flex">
            <div class="flex-1 items-center flex">
              <p class="text-xl">Filtros</p>
            </div>
            <button
              id="close-filter-card-btn"
              class="cursor-pointer text-gray-500 hover:text-white text-2xl"
            >
              x
            </button>
          </div>
          <div class="flex-1">
            <form id="filter-form" class="flex flex-col gap-5">
              <div class="flex flex-col gap-3">
                <p>Range</p>
                <div
                  id="range-check-div"
                  class="blorder-1 flex gap-2 flex-wrap"
                >
                  <div>
                    <input type="checkbox" id="high" name="range" value="h" />
                    <label for="high"> High</label><br />
                  </div>
                  <div>
                    <input type="checkbox" id="medium" name="range" value="m" />
                    <label for="medium"> Mid</label><br />
                  </div>
                  <div>
                    <input type="checkbox" id="low" name="range" value="l" />
                    <label for="low"> Low</label>
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>Block</p>
                <div
                  id="block-check-div"
                  class="blorder-1 flex gap-2 flex-wrap"
                >
                  <div>
                    <input
                      type="checkbox"
                      id="positive-block"
                      name="block"
                      value="Positive"
                    />
                    <label for="positive-block"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-block"
                      name="block"
                      value="Negative"
                    />
                    <label for="negative-block"> Negative</label><br />
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>Hit</p>
                <div id="hit-check-div" class="blorder-1 flex gap-2flex-wrap">
                  <div>
                    <input
                      type="checkbox"
                      id="positive-hit"
                      name="hit"
                      value="Positive"
                    />
                    <label for="positive-hit"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-hit"
                      name="hit"
                      value="Negative"
                    />
                    <label for="negative-hit"> Negative</label><br />
                  </div>
                </div>
              </div>
              <div class="flex flex-col gap-3">
                <p>CH</p>
                <div id="ch-check-div" class="blorder-1 flex gap-2 flex-wrap">
                  <div>
                    <input
                      type="checkbox"
                      id="positive-ch"
                      name="ch"
                      value="Positive"
                    />
                    <label for="positive-ch"> Positive</label><br />
                  </div>
                  <div>
                    <input
                      type="checkbox"
                      id="negative-ch"
                      name="ch"
                      value="Negative"
                    />
                    <label for="negative-ch"> Negative</label><br />
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div
        id="content"
        class="sm:w-min mx-auto fixed inset-0 p-1 pt-2 sm:p-5 flex z-90 flex-col-reverse sm:flex-row h-dvh"
      >
        <div class="flex h-92/100 flex-1 flex-col gap-2">
          <div class="max-h-16/100 w-full items-start gap-2">
            <div id="back-btn-div" class="h-5/10 text-white flex items-center">
              <a
                id="back-btn"
                class="items-center flex hover:text-blue-400"
                href="/"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5 mr-2"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                    clip-rule="evenodd"
                  ></path>
                </svg>
                <span class="text-base font-medium">Voltar para a seleção</span>
              </a>
            </div>
            <!-- <div id="" class="hidden text-2xl text-stone-300 font-black px-1">
              teste
            </div> -->
            <div id="header-div" class="h-5/10 w-full flex justify-between">
              <div
                id="title"
                class="h-full flex text-gray-300 justify-center items-center text-center sm:text-xl"
              >
                <div
                  id="title-char-img-div"
                  class="h-full hidden border-black border-2"
                >
                  <img
                    id="title-char-img"
                    class="w-full h-full aspect-square object-cover"
                    src=""
                    alt=""
                  />
                </div>
                <p
                  id="CharName"
                  class="text-2xl text-stone-300 font-black px-1"
                >
                  Tekken 6 Framedata
                </p>
              </div>
              <div
                id="filter-btn-div"
                class="text-white text-xl h-full flex items-end"
              >
                <button
                  id="filter-card-btn"
                  class="bg-blue-900 hover:bg-blue-500 cursor-pointer p-1 rounded-xs"
                >
                  <p class="">Filtros</p>
                </button>
              </div>
            </div>
          </div>
          <div
            class="h-95/100 sm:items-center flex flex-col w-full sm:w-full max-w-full"
          >
            <div
              id="main-container"
              class="flex gap-5 h-full sm:w-auto max-w-dvw"
            ></div>
            <div
              id="char-list"
              class="gap-2 sm:justify-center max-h-full w-full flex flex-wrap overflow-y-auto"
            ></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
